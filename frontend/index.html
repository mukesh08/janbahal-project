<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NewaCore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        background: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        gap: 20px;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #app-loader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .loader-mark {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Poppins', sans-serif;
        font-weight: 800;
        font-size: 1.8rem;
        color: #fff;
        animation: logoPulse 1.6s ease-in-out infinite;
      }
      .loader-name {
        font-family: 'Poppins', sans-serif;
        font-weight: 700;
        font-size: 1.1rem;
        color: #0f172a;
        letter-spacing: 0.5px;
      }
      .loader-dots {
        display: flex;
        gap: 6px;
      }
      .loader-dots span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #4f46e5;
        animation: dotBounce 1.2s ease-in-out infinite;
      }
      .loader-dots span:nth-child(2) { animation-delay: 0.2s; }
      .loader-dots span:nth-child(3) { animation-delay: 0.4s; }

      @keyframes logoPulse {
        0%, 100% { transform: scale(1);      box-shadow: 0 0 0 0 rgba(79,70,229,0.3); }
        50%       { transform: scale(1.08);   box-shadow: 0 0 0 12px rgba(79,70,229,0); }
      }
      @keyframes dotBounce {
        0%, 80%, 100% { transform: translateY(0);    opacity: 0.4; }
        40%           { transform: translateY(-8px);  opacity: 1;   }
      }
    </style>
  </head>
  <body>
    <div id="app-loader">
      <div class="loader-mark">J</div>
      <div class="loader-name">NewaCore</div>
      <div class="loader-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
